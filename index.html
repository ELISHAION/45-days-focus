<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#12181B">
<title>45 Days Focus</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- ============ SPLASH SCREEN ============ -->
<div id="splash" class="splash">
  <div class="splash-mark">45</div>
  <div class="splash-app-name">45 Days Focus</div>
  <div class="splash-greeting" id="splash-greeting">Hello, Elisha</div>
  <div class="splash-quote" id="splash-quote">Loading your day…</div>
</div>

<!-- ============ ONBOARDING (first launch) ============ -->
<div id="onboarding" class="overlay hidden">
  <div class="overlay-card">
    <div class="brand-mark">45</div>
    <h1>45 Days Focus</h1>
    <p class="muted">MongoDB + AI learning challenge tracker.<br>All data stays on this device.</p>
    <label class="field-label">When does your challenge start?</label>
    <div id="onboarding-calendar"></div>
    <button id="onboarding-confirm" class="btn-primary">Start My Challenge</button>
  </div>
</div>

<!-- ============ APP SHELL ============ -->
<div id="app" class="hidden">

  <header class="topbar">
    <div class="topbar-title" id="topbar-title">Daily Activity</div>
    <div style="display:flex;">
      <button id="theme-toggle" class="icon-btn" aria-label="Toggle theme" title="Toggle light/dark">🌙</button>
      <button id="settings-btn" class="icon-btn" aria-label="Settings" title="Settings">⚙️</button>
    </div>
  </header>

  <main id="view-root" class="view-root"></main>

  <nav class="bottom-nav">
    <button class="nav-btn active" data-tab="daily">
      <span class="nav-icon">📅</span>
      <span class="nav-label">Daily Activity</span>
    </button>
    <button class="nav-btn" data-tab="roadmap">
      <span class="nav-icon">🧭</span>
      <span class="nav-label">45-Day Roadmap</span>
    </button>
    <button class="nav-btn" data-tab="expenses">
      <span class="nav-icon">💰</span>
      <span class="nav-label">Expenses</span>
    </button>
  </nav>
</div>

<!-- ============ GENERIC MODAL ============ -->
<div id="modal-backdrop" class="modal-backdrop hidden">
  <div id="modal-card" class="modal-card"></div>
</div>

<!-- ============ TOAST ============ -->
<div id="toast" class="toast hidden"></div>

<script src="script.js"></script>
</body>
</html>
